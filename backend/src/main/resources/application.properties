spring.application.name=signal
server.port=8080

# Load backend/.env (gitignored secret store). optional: so CI / containers without
# the file start normally; [ .properties ] forces the parser because the extension
# is not a known config-data type. OS environment variables still win.
spring.config.import=optional:file:./.env[.properties]

# Datasource — all values come from env / .env; never hardcode secrets
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/signal}
spring.datasource.username=${DB_USER:signal}
spring.datasource.password=${DB_PASSWORD:signal}
spring.datasource.hikari.maximum-pool-size=10

# Flyway
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# No external cache: the service is a single instance, so nothing needs Redis on the
# request path. Rate limiting is in-process (app.security.rate-limit below).

# Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized

# Frontend origin (dev)
signal.cors.allowed-origin=${CORS_ORIGIN:http://localhost:3000}

# JWT — env vars override these (OS environment outranks application.properties).
# Written as literals, not ${JWT_*:default}: a same-name placeholder recurses into
# itself whenever the variable is absent, which Spring reports as "circular
# placeholder" and points nowhere. JWT_SECRET stays empty so a missing secret fails
# fast inside JwtService with a message that says what is wrong.
JWT_SECRET=
JWT_ACCESS_EXPIRATION=900
JWT_REFRESH_EXPIRATION=604800

# Ingestion (Phase 4) — all tunables from env, no hardcoded business values
github.api-base=${GITHUB_API_BASE_URL:https://api.github.com}
github.max-items=${GITHUB_MAX_ITEMS:5}
ingestion.http-timeout-ms=${INGESTION_HTTP_TIMEOUT:8000}
ingestion.max-response-bytes=${INGESTION_MAX_RESPONSE_SIZE:5242880}
ingestion.max-file-bytes=${INGESTION_MAX_FILE_SIZE:10485760}

# Sync-path auto-pipeline caps — per sync request. Each new item costs provider
# round-trips (understanding; one embedding per chunk), all on the request thread,
# so the batch is bounded. The remainder is not lost: POST /api/v1/knowledge/reindex
# (idempotent) covers the full corpus. 0 disables the step on the request path.
app.pipeline.auto-understand-limit=${AUTO_UNDERSTAND_LIMIT:20}
app.pipeline.auto-chunk-limit=${AUTO_CHUNK_LIMIT:20}

# Credential-endpoint rate limiting (429 + Retry-After). In-process sliding window:
# the backend is a single instance and CI has no Redis, so the brute-force guard must
# not depend on one. Limits are per client address; a limit of 0 disables that rule,
# app.security.rate-limit.enabled=false disables all of them (load tests only).
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
app.security.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:10}
app.security.rate-limit.register-per-hour=${RATE_LIMIT_REGISTER_PER_HOUR:30}
app.security.rate-limit.refresh-per-minute=${RATE_LIMIT_REFRESH_PER_MINUTE:30}
# Only true behind a proxy you control — the header is client-controlled otherwise.
app.security.rate-limit.trust-forwarded-for=${RATE_LIMIT_TRUST_FORWARDED_FOR:false}
app.security.rate-limit.max-tracked-keys=${RATE_LIMIT_MAX_TRACKED_KEYS:20000}

# AI gateway (Phase 5.2) — all from env; apiKey intentionally has NO default
ai.provider=${AI_PROVIDER:}
ai.base-url=${AI_BASE_URL:}
ai.model=${AI_MODEL:}
ai.embedding-model=${AI_EMBEDDING_MODEL:}
ai.api-key=${AI_API_KEY:}
ai.timeout-ms=${AI_TIMEOUT_MS:20000}
ai.max-retries=${AI_MAX_RETRIES:2}

# Embeddings may use a DIFFERENT provider than chat (e.g. chat on ModelScope,
# embeddings on Alibaba DashScope). Blank values fall back to the chat coordinates,
# so a single-provider setup needs no extra config.
# Dimensions MUST match the vector(…) schema columns — see V17 (1024).
ai.embedding-base-url=${AI_EMBEDDING_BASE_URL:}
ai.embedding-api-key=${AI_EMBEDDING_API_KEY:}
ai.embedding-dimensions=${AI_EMBEDDING_DIMENSIONS:1024}

# Cross-encoder re-ranking (Phase 6, precision pass after hybrid retrieval).
# Blank base-url / api-key fall back to the embedding coordinates. NB DashScope serves
# re-ranking from its NATIVE path (/api/v1/services/rerank/…), not compatible-mode, so
# AI_RERANK_BASE_URL is set explicitly in .env.
ai.rerank-model=${AI_RERANK_MODEL:}
ai.rerank-base-url=${AI_RERANK_BASE_URL:}
ai.rerank-api-key=${AI_RERANK_API_KEY:}

# Semantic dedup (Phase 5.6)
app.dedup.similarity-threshold=${DEDUP_THRESHOLD:0.85}

# RAG context budget (Phase 6 K5). Chunks are ~800 chars, so 8000 ≈ 10 sources.
# Raise it for long-context models; the builder always keeps the first source.
app.knowledge.context-max-chars=${KNOWLEDGE_CONTEXT_MAX_CHARS:8000}

# Agent (Phase 7). max-steps is the default step budget for a run (clamped 1–10);
# max-plan-steps is the hard ceiling the planner is allowed to produce.
app.agent.max-steps=${AGENT_MAX_STEPS:6}
app.agent.max-plan-steps=${AGENT_MAX_PLAN_STEPS:10}

# Automation (Phase 8). enabled gates the scheduler tick entirely (switch it off in
# tests / single-node dev); tick-ms is the fixed delay between due-job sweeps.
# max-attempts is the consecutive-failure count at which a job is dead-lettered (disabled
# + a JOB_FAILED notification); retry-backoff-minutes is multiplied by the attempt number
# for a linear backoff. max-signals bounds the daily brief's source list.
app.automation.enabled=${AUTOMATION_ENABLED:true}
app.automation.tick-ms=${AUTOMATION_TICK_MS:60000}
app.automation.max-attempts=${AUTOMATION_MAX_ATTEMPTS:3}
app.automation.retry-backoff-minutes=${AUTOMATION_RETRY_BACKOFF_MINUTES:5}
app.brief.max-signals=${BRIEF_MAX_SIGNALS:10}
