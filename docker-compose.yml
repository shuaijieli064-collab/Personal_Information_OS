# SIGNAL local dev environment — PostgreSQL 16 (pgvector).
# Usage: docker compose up -d
# No Kubernetes, no extra services. Add when a real need exists — Redis was removed
# because nothing used it; rate limiting is in-process (see RateLimitFilter).

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: signal-postgres
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
    ports:
      - "5432:5432"
    volumes:
      - signal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  signal-pgdata:
