# SIGNAL local dev environment — PostgreSQL 16 + Redis 7.
# Usage: docker compose up -d
# No Kubernetes, no extra services. Add when a real need exists.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: signal-postgres
    environment:
      POSTGRES_DB: signal
      POSTGRES_USER: signal
      POSTGRES_PASSWORD: signal
    ports:
      - "5432:5432"
    volumes:
      - signal-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U signal -d signal"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: signal-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  signal-pgdata:
